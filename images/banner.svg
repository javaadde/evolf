    <rect x="694" y="214" width="120" height="38" rx="12" fill="#111827" stroke="#A78BFA"/>
    <text x="722" y="239" fill="#C4B5FD" font-family="Verdana, Geneva, sans-serif" font-size="18" font-weight="700">npx</text>
    <rect x="828" y="214" width="180" height="38" rx="12" fill="#111827" stroke="#22D3EE"/>
