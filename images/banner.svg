  <text x="560" y="108" fill="#F8FAFC" font-family="Verdana, Geneva, sans-serif" font-size="48" font-weight="700">Evolf</text>
  <text x="560" y="148" fill="#93C5FD" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="600">Ink-powered terminal UI for controlling mouse LED modes</text>
  <text x="560" y="188" fill="#CBD5E1" font-family="Verdana, Geneva, sans-serif" font-size="18">Quick start with npx, persistent install with npm, optional pnpm dlx</text>

  <g>
